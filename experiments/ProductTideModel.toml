# ProductTideModel — multiplicative station × Doodson product with gating layers
#
# Astronomically driven: inputs are Doodson numbers computed from time and
# station coordinates.  The waterlevel file serves as both the target and the
# source of station coordinates; it is routed to input and target via model_io.
#
# Usage:
#   pixi run julia --project train.jl examples/ProductTideModel.toml
#
# Increase nepochs to 500+ for a meaningful training run.

[run_info]
runid       = "example"
description = "Product tide model trained on 2011 Schureman tides."

[model_settings]
model_name = "ProductTideModel"
freqs      = ["SSA", "K1", "O1", "Q1", "P1", "M2", "S2", "N2", "K2", "H"]

[model_settings.model_pars]
nfeats  = 64
nlayers = 4

[train_settings]
nepochs          = 2000
nbatches         = 64
learning_rate    = 5.0e-3
lr_decay_factor  = 0.1
lr_decay_rate    = 400
patience         = 5
validation_split = 0.2

[data_settings.model_io]
input  = ["waterlevel"]
target = ["waterlevel"]

[[data_settings.files]]
path      = "../test_data/tides_schureman_2010.nc"
format    = "netcdf"
split     = "training"
variables = ["waterlevel"]

[[data_settings.files]]
path      = "../test_data/tides_schureman_2011.nc"
format    = "netcdf"
split     = "validation"
variables = ["waterlevel"]

[[data_settings.files]]
path      = "../test_data/tides_schureman_2012.nc"
format    = "netcdf"
split     = "testing"
variables = ["waterlevel"]

[output_settings]
write_summary = true
series_format = "netcdf"
tidal_analysis_constituents = "month"  # "year" requires ~1 year of data; use "month" for short test runs

    [[output_settings.outputs]]
    write_stats = true
    fft = true
    scatter = true
    write_series = true
    timeseries = true
    tidal_analysis = true
    split = "testing"

    [[output_settings.outputs]]
    write_stats = true
    fft = true
    scatter = true
    write_series = true
    timeseries = true
    tidal_analysis = true
    split = "validation"

    [[output_settings.outputs]]
    write_stats = true
    fft = true
    scatter = true
    write_series = true
    timeseries = true
    tidal_analysis = true
    split = "training"

    [[output_settings.outputs]]
    split        = "testing"
    name         = "storm_andrea_2012"
    timerange    = ["2012-01-02", "2012-01-08"]
    timeseries   = true
    fft          = false
    scatter      = false
    write_stats  = true
    write_series = false

