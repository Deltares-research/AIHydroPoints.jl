# LinearSurgeModel — single Dense layer surge model (fast baseline)
#
# Usage:
#   pixi run julia --project train.jl experiments/LinearSurgeModel.toml

[run_info]
runid       = "2010_base"
description = "Linear surge model trained on 2011 ERA5 wind stress and Schureman surge."

[model_settings]
model_name = "LinearSurgeModel"
nlags      = 16

[train_settings]
nepochs          = 400
nbatches         = 64
learning_rate    = 1.0e-3
lr_decay_factor  = 0.1
lr_decay_rate    = 400
patience         = 5
validation_split = 0.2

[data_settings.model_io]
input  = ["stress_x", "stress_y", "pressure"]
target = ["surge"]

[[data_settings.files]]
path      = "../test_data/surge_schureman_2011.nc"
format    = "netcdf"
split     = "training"
variables = ["surge"]

[[data_settings.files]]
path      = "../test_data/era5_wind_stress_2011_testing.jld2"
format    = "jld2"
split     = "training"
variables = ["stress_x", "stress_y", "pressure"]

[[data_settings.files]]
path      = "../test_data/surge_schureman_2012.nc"
format    = "netcdf"
split     = "testing"
variables = ["surge"]

[[data_settings.files]]
path      = "../test_data/era5_wind_stress_2012_validation.jld2"
format    = "jld2"
split     = "testing"
variables = ["stress_x", "stress_y", "pressure"]

[output_settings]
write_summary = true
series_format = "netcdf"

    [[output_settings.outputs]]
    write_stats = true
    fft = true
    scatter = true
    write_series = true
    timeseries = true
    split = "testing"

    [[output_settings.outputs]]
    split        = "testing"
    name         = "storm_andrea_2012"
    timerange    = ["2012-01-02", "2012-01-08"]
    timeseries   = true
    fft          = false
    scatter      = true
    write_stats  = true
    write_series = false
