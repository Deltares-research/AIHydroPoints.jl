# ConvSurgeModel — 1-year training baseline (2019)
#
# Training : 2019
# Validation: 2020
# Testing  : 2021–2022
#
# Usage:
#   ../../bin/train surge_1yr_ConvSurgeModel.toml

[run_info]
runid       = "surge_1yr"
description = "ConvSurgeModel baseline: 1-year training (2019), val 2020, test 2021–2022.. 317 stations."

[model_settings]
model_name = "ConvSurgeModel"
nlags      = 16

[model_settings.model_pars]
channels   = [32, 16]
filtersize = 3

[train_settings]
nepochs         = 20
nbatches        = 64
learning_rate   = 1.0e-3
lr_decay_factor = 0.5
lr_decay_rate   = 10
patience        = 10

[data_settings.model_io]
input  = ["stress_x", "stress_y", "pressure"]
target = ["surge"]

# ── Training: 2019 ────────────────────────────────────────────────────────────
[[data_settings.files]]
path      = "../../data/dscm_2000_2022_317points/surge_schureman_2000_2022_317stations_his.jld2"
format    = "jld2"
split     = "training"
timerange = ["2019-01-01", "2020-01-01"]
variables = [{name="values", as="surge"}]

[[data_settings.files]]
path      = "../../data/era_2000_2022_317points/era5_2000_2022_317points_wind_stress_x.jld2"
format    = "jld2"
split     = "training"
timerange = ["2019-01-01", "2020-01-01"]
variables = [{name="values", as="stress_x"}]

[[data_settings.files]]
path      = "../../data/era_2000_2022_317points/era5_2000_2022_317points_wind_stress_y.jld2"
format    = "jld2"
split     = "training"
timerange = ["2019-01-01", "2020-01-01"]
variables = [{name="values", as="stress_y"}]

[[data_settings.files]]
path      = "../../data/era_2000_2022_317points/era5_2000_2022_317points_mean_sea_level_pressure.jld2"
format    = "jld2"
split     = "training"
timerange = ["2019-01-01", "2020-01-01"]
variables = [{name="values", as="pressure"}]

# ── Validation: 2020 ──────────────────────────────────────────────────────────
[[data_settings.files]]
path      = "../../data/dscm_2000_2022_317points/surge_schureman_2000_2022_317stations_his.jld2"
