# ── Output ────────────────────────────────────────────────────────────────────
[output_settings]
write_summary = true
series_format = "netcdf"

    [[output_settings.outputs]]
    split        = "training"
    write_stats  = true
    fft          = false
    scatter      = false
    write_series = false
    timeseries   = false

    [[output_settings.outputs]]
    split        = "validation"
    write_stats  = true
    fft          = false
    scatter      = true
    write_series = false
    timeseries   = false

    [[output_settings.outputs]]
    split        = "testing"
    write_stats  = true
    fft          = true
    scatter      = true
    write_series = true
    timeseries   = true

    [[output_settings.outputs]]
    split        = "testing"
    name         = "storm_eunice_2022"
    timerange    = ["2022-02-15", "2022-02-25"]
    timeseries   = true
    fft          = false
    scatter      = true
    write_stats  = true
    write_series = false
