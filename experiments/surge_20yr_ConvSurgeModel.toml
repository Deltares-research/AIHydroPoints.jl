# ConvSurgeModel — 20-year training baseline (2000–2019)
#
# Training : 2019
# Validation: 2020
# Testing  : 2021–2022
#
# Usage:
#   pixi run julia --project train.jl experiments/surge_20yr_ConvSurgeModel.toml

[run_info]
runid       = "surge_20yr"
description = "ConvSurgeModel baseline: 20-year training (2000–2019), val 2020, test 2021–2022."

[model_settings]
model_name = "ConvSurgeModel"
nlags      = 16

[model_settings.model_pars]
channels   = [32, 16]
filtersize = 3

[train_settings]
nepochs         = 20
nbatches        = 64
learning_rate   = 1.0e-3
lr_decay_factor = 0.1
lr_decay_rate   = 400
patience        = 10

[data_settings.model_io]
input  = ["stress_x", "stress_y", "pressure"]
target = ["surge"]

# ── Training: 2019 ────────────────────────────────────────────────────────────
[[data_settings.files]]
path      = "../data/dscm_2000_2022_5points/surge_schureman_2000_2022_5stations.jld2"
format    = "jld2"
split     = "training"
timerange = ["2000-01-01", "2020-01-01"]
variables = [{name="values", as="surge"}]

[[data_settings.files]]
path      = "../data/era_2000_2022_9points/era5_2000_2022_9points_wind_stress_x.jld2"
format    = "jld2"
split     = "training"
timerange = ["2000-01-01", "2020-01-01"]
variables = [{name="values", as="stress_x"}]

[[data_settings.files]]
path      = "../data/era_2000_2022_9points/era5_2000_2022_9points_wind_stress_y.jld2"
format    = "jld2"
split     = "training"
timerange = ["2000-01-01", "2020-01-01"]
variables = [{name="values", as="stress_y"}]

[[data_settings.files]]
path      = "../data/era_2000_2022_9points/era5_2000_2022_9points_mean_sea_level_pressure.jld2"
format    = "jld2"
split     = "training"
timerange = ["2000-01-01", "2020-01-01"]
variables = [{name="values", as="pressure"}]

# ── Validation: 2020 ──────────────────────────────────────────────────────────
[[data_settings.files]]
path      = "../data/dscm_2000_2022_5points/surge_schureman_2000_2022_5stations.jld2"
format    = "jld2"
split     = "validation"
timerange = ["2020-01-01", "2021-01-01"]
variables = [{name="values", as="surge"}]

[[data_settings.files]]
path      = "../data/era_2000_2022_9points/era5_2000_2022_9points_wind_stress_x.jld2"
format    = "jld2"
split     = "validation"
timerange = ["2020-01-01", "2021-01-01"]
variables = [{name="values", as="stress_x"}]

[[data_settings.files]]
path      = "../data/era_2000_2022_9points/era5_2000_2022_9points_wind_stress_y.jld2"
format    = "jld2"
split     = "validation"
timerange = ["2020-01-01", "2021-01-01"]
variables = [{name="values", as="stress_y"}]

[[data_settings.files]]
path      = "../data/era_2000_2022_9points/era5_2000_2022_9points_mean_sea_level_pressure.jld2"
format    = "jld2"
split     = "validation"
timerange = ["2020-01-01", "2021-01-01"]
variables = [{name="values", as="pressure"}]

# ── Testing: 2021–2022 ────────────────────────────────────────────────────────
[[data_settings.files]]
path      = "../data/dscm_2000_2022_5points/surge_schureman_2000_2022_5stations.jld2"
format    = "jld2"
split     = "testing"
timerange = ["2021-01-01", "2023-01-01"]
variables = [{name="values", as="surge"}]

[[data_settings.files]]
path      = "../data/era_2000_2022_9points/era5_2000_2022_9points_wind_stress_x.jld2"
format    = "jld2"
split     = "testing"
timerange = ["2021-01-01", "2023-01-01"]
variables = [{name="values", as="stress_x"}]

[[data_settings.files]]
path      = "../data/era_2000_2022_9points/era5_2000_2022_9points_wind_stress_y.jld2"
