# AIHydroPoints run configuration -- full settings reference:
# https://deltares-research.github.io/AIHydroPoints.jl/settings.html
format_version = 2

# ConvInteractionModel — 1-year training baseline (2019)
#
# The interaction target is the surge residual:
#   target = surge_observed - surge_prediction (20yr ConvSurgeModel)
#
# Generate the residual file first:
#   pixi run julia --project predict.jl experiments/predict_surge_residual_20yr.toml
#
# Training : 2019
# Validation: 2020
# Testing  : 2021–2022
#
# Usage:
#   pixi run julia --project train.jl experiments/interaction_1yr_ConvInteractionModel.toml

[run_info]
runid       = "interaction_1yr"
description = "ConvInteractionModel baseline: 1-year training (2019), val 2020, test 2021–2022."

[model_settings]
model_name = "ConvInteractionModel"
nlags      = 16

[model_settings.model_pars]
channels = [64, 32, 16, 1]

[train_settings]
nepochs         = 250
batch_size        = 256 #64
learning_rate   = 5.0e-2
lr_decay_factor = 0.1
lr_decay_epochs   = 400
early_stopping_epochs        = 10

[data_settings.model_io]
input  = ["tide", "surge"]
target = ["interaction"]

# ── Training: 2019 ────────────────────────────────────────────────────────────
[[data_settings.files]]
path      = "../../data/dscm_2000_2022_5points/tides_schureman_2000_2022_5stations.jld2"
format    = "jld2"
split     = "training"
timerange = ["2019-01-01", "2020-01-01"]
variables = [{name="values", as="tide"}]

[[data_settings.files]]
path      = "../../data/dscm_2000_2022_5points/surge_schureman_2000_2022_5stations.jld2"
format    = "jld2"
split     = "training"
timerange = ["2019-01-01", "2020-01-01"]
variables = [{name="values", as="surge"}]

[[data_settings.files]]
path      = "../../data/dscm_2000_2022_5points/surge_residual_20yr_ConvSurgeModel_2000_2022_5stations.jld2"
format    = "jld2"
split     = "training"
timerange = ["2019-01-01", "2020-01-01"]
variables = [{name="values", as="interaction"}]

# ── Validation: 2020 ──────────────────────────────────────────────────────────
[[data_settings.files]]
path      = "../../data/dscm_2000_2022_5points/tides_schureman_2000_2022_5stations.jld2"
format    = "jld2"
split     = "validation"
timerange = ["2020-01-01", "2021-01-01"]
variables = [{name="values", as="tide"}]

[[data_settings.files]]
path      = "../../data/dscm_2000_2022_5points/surge_schureman_2000_2022_5stations.jld2"
format    = "jld2"
split     = "validation"
timerange = ["2020-01-01", "2021-01-01"]
variables = [{name="values", as="surge"}]

[[data_settings.files]]
path      = "../../data/dscm_2000_2022_5points/surge_residual_20yr_ConvSurgeModel_2000_2022_5stations.jld2"
format    = "jld2"
split     = "validation"
timerange = ["2020-01-01", "2021-01-01"]
variables = [{name="values", as="interaction"}]

# ── Testing: 2021–2022 ────────────────────────────────────────────────────────
[[data_settings.files]]
path      = "../../data/dscm_2000_2022_5points/tides_schureman_2000_2022_5stations.jld2"
format    = "jld2"
split     = "testing"
timerange = ["2021-01-01", "2023-01-01"]
variables = [{name="values", as="tide"}]

[[data_settings.files]]
path      = "../../data/dscm_2000_2022_5points/surge_schureman_2000_2022_5stations.jld2"
format    = "jld2"
split     = "testing"
timerange = ["2021-01-01", "2023-01-01"]
variables = [{name="values", as="surge"}]

[[data_settings.files]]
path      = "../../data/dscm_2000_2022_5points/surge_residual_20yr_ConvSurgeModel_2000_2022_5stations.jld2"
format    = "jld2"
split     = "testing"
timerange = ["2021-01-01", "2023-01-01"]
variables = [{name="values", as="interaction"}]

# ── Output ────────────────────────────────────────────────────────────────────
[output_settings]
write_summary = true
series_format = "netcdf"

    [[output_settings.outputs]]
    split        = "training"
    write_stats  = true
    plot_fft          = false
    plot_scatter      = false
    write_series = false
    plot_timeseries   = false

    [[output_settings.outputs]]
    split        = "validation"
    write_stats  = true
    plot_fft          = false
    plot_scatter      = true
    write_series = false
    plot_timeseries   = false

    [[output_settings.outputs]]
    split        = "testing"
    write_stats  = true
    plot_fft          = true
    plot_scatter      = true
    write_series = true
    plot_timeseries   = true

    [[output_settings.outputs]]
    split        = "testing"
    name         = "storm_eunice_2022"
    timerange    = ["2022-02-15", "2022-02-25"]
    plot_timeseries   = true
    plot_fft          = false
    plot_scatter      = true
    write_stats  = true
    write_series = false