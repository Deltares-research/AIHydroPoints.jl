# AIHydroPoints run configuration -- full settings reference:
# https://deltares-research.github.io/AIHydroPoints.jl/settings.html
format_version = 2

# DenseSurgeInteractionModel — 20-year training baseline (2000–2019)
#
# Unstructured deep MLP over concatenated forcing + tide (brainstorm_surge_model_status.md,
# item 2's "+tide" variant): flattens wind-stress/pressure forcing and tide lag windows,
# concatenates them, and runs several Dense layers with a nonlinearity — no built-in
# inductive bias about how tide and forcing combine, contrast with
# BiLinearSurgeInteractionModel's multiplicative gate. model_pars (hidden_dims=[64,32],
# activation="swish") from the DenseSurgeInteractionModel hidden_dims sweep at 20yr (depth
# helps here, unlike the no-tide DenseSurgeModel); early_stopping_epochs=25/nepochs=100
# from the same round of sweeps (see brainstorm doc, item 2).
#
# Training : 2000–2019
# Validation: 2020
# Testing  : 2021–2022
#
# Usage:
#   pixi run julia --project train.jl experiments/5stations/surge_20yr_DenseSurgeInteractionModel.toml

[run_info]
runid       = "surge_20yr"
description = "DenseSurgeInteractionModel: 20-year training (2000–2019), val 2020, test 2021–2022."

[model_settings]
model_name = "DenseSurgeInteractionModel"
nlags      = 48

[model_settings.model_pars]
hidden_dims = [64, 32]
activation  = "swish"

[train_settings]
nepochs         = 100
batch_size      = 128
learning_rate   = 1.0e-3
lr_decay_factor = 0.4
lr_decay_epochs = 15
early_stopping_epochs = 25
weight_decay      = 1.0e-4

[data_settings.model_io]
input  = ["stress_x", "stress_y", "pressure", "tide"]
target = ["surge"]

# ── Training: 2000–2019 ───────────────────────────────────────────────────────
[[data_settings.files]]
path      = "../../data/dscm_2000_2022_5points/surge_schureman_2000_2022_5stations.jld2"
format    = "jld2"
split     = "training"
timerange = ["2000-01-01", "2020-01-01"]
variables = [{name="values", as="surge"}]

[[data_settings.files]]
path      = "../../data/dscm_2000_2022_5points/tides_schureman_2000_2022_5stations.jld2"
format    = "jld2"
split     = "training"
timerange = ["2000-01-01", "2020-01-01"]
variables = [{name="values", as="tide"}]

[[data_settings.files]]
path      = "../../data/era_2000_2022_9points/era5_2000_2022_9points_wind_stress_x.jld2"
format    = "jld2"
split     = "training"
timerange = ["2000-01-01", "2020-01-01"]
variables = [{name="values", as="stress_x"}]

[[data_settings.files]]
path      = "../../data/era_2000_2022_9points/era5_2000_2022_9points_wind_stress_y.jld2"
format    = "jld2"
split     = "training"
timerange = ["2000-01-01", "2020-01-01"]
variables = [{name="values", as="stress_y"}]

[[data_settings.files]]
path      = "../../data/era_2000_2022_9points/era5_2000_2022_9points_mean_sea_level_pressure.jld2"
format    = "jld2"
split     = "training"
timerange = ["2000-01-01", "2020-01-01"]
variables = [{name="values", as="pressure"}]

