# ProductTideModel — 5-year training baseline (2015–2019)
#
# Astronomically driven: inputs are Doodson numbers computed from time and
# station coordinates. The tides file serves as both target and coordinate source.
#
# Training : 2019
# Validation: 2020
# Testing  : 2021–2022
#
# Usage:
#   pixi run julia --project train.jl experiments/tide_5yr_ProductTideModel.toml

[run_info]
runid       = "tide_5yr"
description = "ProductTideModel baseline: 5-year training (2015–2019), val 2020, test 2021–2022."

[model_settings]
model_name = "ProductTideModel"
freqs      = ["SSA", "K1", "O1", "Q1", "P1", "M2", "S2", "N2", "K2", "H"]

[model_settings.model_pars]
nfeats  = 64
nlayers = 4

[train_settings]
nepochs         = 20
nbatches        = 64
learning_rate   = 5.0e-3
lr_decay_factor = 0.1
lr_decay_rate   = 400
patience        = 10

[data_settings.model_io]
input  = ["waterlevel"]
target = ["waterlevel"]

# ── Training: 2019 ────────────────────────────────────────────────────────────
[[data_settings.files]]
path      = "../../data/dscm_2000_2022_5points/tides_schureman_2000_2022_5stations.jld2"
format    = "jld2"
split     = "training"
timerange = ["2015-01-01", "2020-01-01"]
variables = [{name="values", as="waterlevel"}]

# ── Validation: 2020 ──────────────────────────────────────────────────────────
[[data_settings.files]]
path      = "../../data/dscm_2000_2022_5points/tides_schureman_2000_2022_5stations.jld2"
format    = "jld2"
split     = "validation"
timerange = ["2020-01-01", "2021-01-01"]
variables = [{name="values", as="waterlevel"}]

# ── Testing: 2021–2022 ────────────────────────────────────────────────────────
[[data_settings.files]]
path      = "../../data/dscm_2000_2022_5points/tides_schureman_2000_2022_5stations.jld2"
format    = "jld2"
split     = "testing"
timerange = ["2021-01-01", "2023-01-01"]
variables = [{name="values", as="waterlevel"}]

# ── Output ────────────────────────────────────────────────────────────────────
[output_settings]
write_summary               = true
series_format               = "netcdf"
tidal_analysis_constituents = "year"

    [[output_settings.outputs]]
    split          = "training"
    write_stats    = true
    fft            = false
    scatter        = false
    write_series   = false
    timeseries     = false
    tidal_analysis = false

    [[output_settings.outputs]]
    split          = "validation"
    write_stats    = true
    fft            = false
    scatter        = true
    write_series   = false
    timeseries     = false
    tidal_analysis = false

    [[output_settings.outputs]]
    split          = "testing"
    write_stats    = true
    fft            = true
    scatter        = true
    write_series   = true
    timeseries     = true
    tidal_analysis = true

    [[output_settings.outputs]]
    split        = "testing"
    name         = "storm_eunice_2022"
    timerange    = ["2022-02-15", "2022-02-25"]
    timeseries   = true
    fft          = false
    scatter      = true
    write_stats  = true
    write_series = false
