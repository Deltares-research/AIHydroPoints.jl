# ── Output ────────────────────────────────────────────────────────────────────
[output_settings]
write_summary = true
series_format = "netcdf"

    [[output_settings.outputs]]
    split        = "training"
    write_stats  = true
    plot_fft          = false
    plot_scatter      = false
    write_series = false
    plot_timeseries   = false

    [[output_settings.outputs]]
    split        = "validation"
    write_stats  = true
    plot_fft          = false
    plot_scatter      = true
    write_series = false
    plot_timeseries   = false

    [[output_settings.outputs]]
    split        = "testing"
    write_stats  = true
    plot_fft          = true
    plot_scatter      = true
    write_series = true
    plot_timeseries   = true

    [[output_settings.outputs]]
    split        = "testing"
    name         = "storm_eunice_2022"
    timerange    = ["2022-02-15", "2022-02-25"]
    plot_timeseries   = true
    plot_fft          = false
    plot_scatter      = true
    write_stats  = true
    write_series = false
