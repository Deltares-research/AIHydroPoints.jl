# AIHydroPoints run configuration -- full settings reference:
# https://deltares-research.github.io/AIHydroPoints.jl/settings.html
format_version = 2

# LinearSurgeModel — 1-year training baseline (2019)
#
# Training : 2019
# Validation: 2020
# Testing  : 2021–2022
#
# Usage:
#   pixi run julia --project train.jl experiments/surge_1yr_LinearSurgeModel.toml

[run_info]
runid       = "surge_1yr"
description = "LinearSurgeModel baseline: 1-year training (2019), val 2020, test 2021–2022."

[model_settings]
model_name = "LinearSurgeModel"
nlags      = 16

[train_settings]
nepochs           = 50
batch_size        = 64
learning_rate     = 1.0e-3
lr_decay_factor   = 0.1
lr_decay_epochs   = 10
early_stopping_epochs        = 10
weight_decay      = 1.0e-4

[data_settings.model_io]
input  = ["stress_x", "stress_y", "pressure"]
target = ["surge"]

# ── Training: 2019 ────────────────────────────────────────────────────────────
[[data_settings.files]]
path      = "../../data/dscm_2000_2022_5points/surge_schureman_2000_2022_5stations.jld2"
format    = "jld2"
split     = "training"
timerange = ["2019-01-01", "2020-01-01"]
variables = [{name="values", as="surge"}]

[[data_settings.files]]
path      = "../../data/era_2000_2022_9points/era5_2000_2022_9points_wind_stress_x.jld2"
format    = "jld2"
split     = "training"
timerange = ["2019-01-01", "2020-01-01"]
variables = [{name="values", as="stress_x"}]

[[data_settings.files]]
path      = "../../data/era_2000_2022_9points/era5_2000_2022_9points_wind_stress_y.jld2"
format    = "jld2"
split     = "training"
timerange = ["2019-01-01", "2020-01-01"]
variables = [{name="values", as="stress_y"}]

[[data_settings.files]]
path      = "../../data/era_2000_2022_9points/era5_2000_2022_9points_mean_sea_level_pressure.jld2"
format    = "jld2"
split     = "training"
timerange = ["2019-01-01", "2020-01-01"]
variables = [{name="values", as="pressure"}]

# ── Validation: 2020 ──────────────────────────────────────────────────────────
[[data_settings.files]]
