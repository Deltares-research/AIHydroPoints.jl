# AIHydroPoints run configuration -- full settings reference:
# https://deltares-research.github.io/AIHydroPoints.jl/settings.html
format_version = 2

# DenseSurgeModel (20yr) — full-period residual prediction
#
# Runs the trained 20yr DenseSurgeModel on the full 2000–2022 period and writes
# the residual (surge_schureman − surge_prediction) as a JLD2 file. Used to build
# a tide_candidate = tide_schureman + residual, for the combined-training
# alternating-optimization experiment (combined_training.md).
#
# Prerequisites:
#   pixi run julia --project train.jl experiments/5stations/surge_20yr_DenseSurgeModel.toml
#
# Usage:
#   pixi run julia --project predict.jl experiments/5stations/predict_surge_residual_20yr_DenseSurgeModel.toml

[run_info]
runid       = "surge_residual_20yr"
description = "DenseSurgeModel (20yr) residual on full 2000–2022 period for the combined-training experiment."

[model_settings]
model_dir = "training_output/surge_20yr_DenseSurgeModel"

[data_settings.model_io]
input  = ["stress_x", "stress_y", "pressure"]
target = ["surge"]

# ── Full period: 2000–2022 ─────────────────────────────────────────────────────
[[data_settings.files]]
path      = "../../data/dscm_2000_2022_5points/surge_schureman_2000_2022_5stations.jld2"
format    = "jld2"
split     = "testing"
timerange = ["2000-01-01", "2023-01-01"]
variables = [{name="values", as="surge"}]

[[data_settings.files]]
path      = "../../data/era_2000_2022_9points/era5_2000_2022_9points_wind_stress_x.jld2"
format    = "jld2"
split     = "testing"
timerange = ["2000-01-01", "2023-01-01"]
variables = [{name="values", as="stress_x"}]

[[data_settings.files]]
path      = "../../data/era_2000_2022_9points/era5_2000_2022_9points_wind_stress_y.jld2"
format    = "jld2"
split     = "testing"
timerange = ["2000-01-01", "2023-01-01"]
variables = [{name="values", as="stress_y"}]

[[data_settings.files]]
path      = "../../data/era_2000_2022_9points/era5_2000_2022_9points_mean_sea_level_pressure.jld2"
format    = "jld2"
split     = "testing"
timerange = ["2000-01-01", "2023-01-01"]
variables = [{name="values", as="pressure"}]

# ── Output ────────────────────────────────────────────────────────────────────
[output_settings]
write_summary = false

[[output_settings.outputs]]
split         = "testing"
name          = "full_period"
write_residuals = true
residual_path = "/home/verlaan/deepblack/src/AIHydroPoints.jl.git_claude/data/dscm_2000_2022_5points/surge_residual_20yr_DenseSurgeModel_2000_2022_5stations.jld2"
