# AIHydroPoints run configuration -- full settings reference:
# https://deltares-research.github.io/AIHydroPoints.jl/settings.html
format_version = 2

# ConvSurgeModel — inference example
#
# Runs predictions using a previously trained ConvSurgeModel.
# Train the model first:
#   pixi run julia --project train.jl examples/ConvSurgeModel.toml
#
# Then run inference:
#   pixi run julia --project predict.jl examples/predict_ConvSurgeModel.toml

[run_info]
runid       = "example_predict"
description = "ConvSurgeModel inference on 2012 test data."

[model_settings]
model_dir = "training_output/example_ConvSurgeModel"

[data_settings.model_io]
input  = ["stress_x", "stress_y", "pressure"]
target = ["surge"]

[[data_settings.files]]
path      = "../test_data/surge_schureman_2012.nc"
format    = "netcdf"
split     = "testing"
variables = ["surge"]

[[data_settings.files]]
path      = "../test_data/era5_wind_stress_2012_validation.jld2"
format    = "jld2"
split     = "testing"
variables = ["stress_x", "stress_y", "pressure"]

[output_settings]
write_summary = false

[[output_settings.outputs]]
split       = "testing"
plot_timeseries  = true
plot_scatter     = true
write_stats = true