# AIHydroPoints run configuration -- full settings reference:
# https://deltares-research.github.io/AIHydroPoints.jl/settings.html
format_version = 2

# DenseSurgeModel — unstructured deep MLP surge model
#
# Generalises LinearSurgeModel (a single Dense layer) to several Dense layers
# with a nonlinearity, to test whether depth/nonlinearity helps beyond a
# linear map, without adding tide or any other input
# (brainstorm_surge_model_status.md, item 2).
#
# Usage:
#   pixi run julia --project train.jl examples/DenseSurgeModel.toml
#
# Increase nepochs to 100+ for a meaningful training run.

[run_info]
runid       = "example"
description = "Deep MLP surge model trained on 2011 ERA5 wind stress and Schureman surge."

[model_settings]
model_name = "DenseSurgeModel"
nlags      = 16

[model_settings.model_pars]
hidden_dims = [64, 32]
activation  = "relu"

[train_settings]
nepochs          = 5
batch_size         = 64
learning_rate    = 1.0e-3
lr_decay_factor  = 0.1
lr_decay_epochs    = 400
early_stopping_epochs         = 5
weight_decay          = 0.0    # L2 weight decay; 0 = off
input_noise_std       = 0.0    # Gaussian input-noise augmentation; 0 = off
validation_split = 0.2

[data_settings.model_io]
input  = ["stress_x", "stress_y", "pressure"]
target = ["surge"]

[[data_settings.files]]
path      = "../test_data/surge_schureman_2011.nc"
format    = "netcdf"
split     = "training"
variables = ["surge"]

[[data_settings.files]]
path      = "../test_data/era5_wind_stress_2011_testing.jld2"
format    = "jld2"
split     = "training"
variables = ["stress_x", "stress_y", "pressure"]

[[data_settings.files]]
path      = "../test_data/surge_schureman_2012.nc"
format    = "netcdf"
split     = "testing"
variables = ["surge"]

[[data_settings.files]]
path      = "../test_data/era5_wind_stress_2012_validation.jld2"
format    = "jld2"
split     = "testing"
variables = ["stress_x", "stress_y", "pressure"]
