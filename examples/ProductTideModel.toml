# ProductTideModel — multiplicative station × Doodson product with gating layers
#
# Usage:
#   bin/train examples/ProductTideModel.toml
#
# Increase nepochs to 500+ for a meaningful training run.

[run_info]
runid       = "example"
description = "Product tide model: 2010 train, 2011 validation, 2012 test."

[model_settings]
model_name = "ProductTideModel"
freqs      = ["SSA", "K1", "O1", "Q1", "P1", "M2", "S2", "N2", "K2", "H"]

[model_settings.model_pars]
nfeats  = 64
nlayers = 4

[train_settings]
nepochs         = 10
nbatches        = 64
learning_rate   = 5.0e-3
lr_decay_factor = 0.1
lr_decay_rate   = 400
patience        = 5

[data_settings.model_io]
input  = ["waterlevel"]
target = ["waterlevel"]

# Training: 2010
[[data_settings.files]]
path      = "../test_data/tides_schureman_2010.nc"
format    = "netcdf"
split     = "training"
variables = ["waterlevel"]

# Validation: 2011
[[data_settings.files]]
path      = "../test_data/tides_schureman_2011.nc"
format    = "netcdf"
split     = "validation"
variables = ["waterlevel"]

# Testing: 2012
[[data_settings.files]]
path      = "../test_data/tides_schureman_2012.nc"
format    = "netcdf"
split     = "testing"
variables = ["waterlevel"]

[output_settings]
tidal_analysis_constituents = "month"

[[output_settings.outputs]]
split          = "testing"
timeseries     = true
tidal_analysis = true
write_stats    = true
