# AIHydroPoints run configuration -- full settings reference:
# https://deltares-research.github.io/AIHydroPoints.jl/settings.html
format_version = 2

# ProductInteractionModel — multiplicative-gate interaction model
#
# Uses a per-station InteractionInputLayer (multiplicative gate) followed by
# strided Conv1D layers.
#
# PLACEHOLDER TARGET
# This example uses surge as a stand-in for the interaction target (loaded
# from the same surge file, aliased to "interaction").  This lets the pipeline
# run end-to-end but produces meaningless results.  Replace with a real
# residual target when available.
#
# Usage:
#   pixi run julia --project train.jl examples/ProductInteractionModel.toml
#
# Increase nepochs to 100+ for a meaningful training run.

[run_info]
runid       = "example"
description = "ProductInteraction model (dummy target) trained on 2011 Schureman tides and surge."

[output_settings]
plot_train = true
plot_test  = true

[model_settings]
model_name = "ProductInteractionModel"
nlags      = 16

[model_settings.model_pars]
channels = [64, 32, 16, 1]

[train_settings]
nepochs          = 5
batch_size         = 64
learning_rate    = 1.0e-3
lr_decay_factor  = 0.1
lr_decay_epochs    = 400
early_stopping_epochs         = 5
weight_decay          = 0.0    # L2 weight decay; 0 = off
input_noise_std       = 0.0    # Gaussian input-noise augmentation; 0 = off
validation_split = 0.2

[data_settings.model_io]
input  = ["tide", "surge"]
target = ["interaction"]

# ── Training split ─────────────────────────────────────────────────────────────

[[data_settings.files]]
path      = "../test_data/tides_schureman_2011.nc"
format    = "netcdf"
split     = "training"
variables = [{name = "waterlevel", as = "tide"}]

[[data_settings.files]]
path      = "../test_data/surge_schureman_2011.nc"
format    = "netcdf"
split     = "training"
variables = ["surge"]

# Surge loaded again as "interaction" — placeholder target
[[data_settings.files]]
path      = "../test_data/surge_schureman_2011.nc"
format    = "netcdf"
split     = "training"
variables = [{name = "surge", as = "interaction"}]

# ── Testing split ──────────────────────────────────────────────────────────────

[[data_settings.files]]
path      = "../test_data/tides_schureman_2012.nc"
format    = "netcdf"
split     = "testing"
variables = [{name = "waterlevel", as = "tide"}]

[[data_settings.files]]
path      = "../test_data/surge_schureman_2012.nc"
format    = "netcdf"
split     = "testing"
variables = ["surge"]

# Surge loaded again as "interaction" — placeholder target
[[data_settings.files]]
path      = "../test_data/surge_schureman_2012.nc"
format    = "netcdf"
split     = "testing"
variables = [{name = "surge", as = "interaction"}]