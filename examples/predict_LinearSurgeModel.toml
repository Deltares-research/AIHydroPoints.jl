# LinearSurgeModel — inference example
#
# Train the model first:
#   bin/train examples/LinearSurgeModel.toml
#
# Then run inference:
#   bin/predict examples/predict_LinearSurgeModel.toml

[run_info]
runid       = "example_predict"
description = "LinearSurgeModel inference on 2012 test data."

[model_settings]
model_dir = "training_output/example_LinearSurgeModel"

[data_settings.model_io]
input  = ["stress_x", "stress_y", "pressure"]
target = ["surge"]

[[data_settings.files]]
path      = "../test_data/surge_schureman_2012.nc"
format    = "netcdf"
split     = "testing"
variables = ["surge"]

[[data_settings.files]]
path      = "../test_data/era5_wind_stress_2012_validation.jld2"
format    = "jld2"
split     = "testing"
variables = ["stress_x", "stress_y", "pressure"]

[output_settings]
write_summary = false

[[output_settings.outputs]]
split       = "testing"
timeseries  = true
write_stats = true
