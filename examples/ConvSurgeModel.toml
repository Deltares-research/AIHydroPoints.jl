# ConvSurgeModel — strided convolutional surge model
#
# Usage:
#   pixi run julia --project train.jl examples/ConvSurgeModel.toml
#
# Increase nepochs to 100+ for a meaningful training run.

[run_info]
runid       = "example"
description = "Convolutional surge model trained on 2011 ERA5 wind stress and Schureman surge."

[model_settings]
model_name = "ConvSurgeModel"
nlags      = 16

[model_settings.model_pars]
channels   = [32, 16]
filtersize = 3

[train_settings]
nepochs          = 5
nbatches         = 64
learning_rate    = 1.0e-3
lr_decay_factor  = 0.1
lr_decay_rate    = 400
patience         = 5
validation_split = 0.2

[data_settings.model_io]
input  = ["stress_x", "stress_y", "pressure"]
target = ["surge"]

[[data_settings.files]]
path      = "../test_data/surge_schureman_2011.nc"
format    = "netcdf"
split     = "training"
variables = ["surge"]

[[data_settings.files]]
path      = "../test_data/era5_wind_stress_2011_testing.jld2"
format    = "jld2"
split     = "training"
variables = ["stress_x", "stress_y", "pressure"]

[[data_settings.files]]
path      = "../test_data/surge_schureman_2012.nc"
format    = "netcdf"
split     = "testing"
variables = ["surge"]

[[data_settings.files]]
path      = "../test_data/era5_wind_stress_2012_validation.jld2"
format    = "jld2"
split     = "testing"
variables = ["stress_x", "stress_y", "pressure"]
