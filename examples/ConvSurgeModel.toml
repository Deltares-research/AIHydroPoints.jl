# ConvSurgeModel — strided convolutional surge model
#
# Usage:
#   pixi run julia --project train.jl examples/ConvSurgeModel.toml
#
# Increase nepochs to 100+ for a meaningful training run.

[run_info]
runid       = "example"
description = "Convolutional surge model: 2010 train, 2011 validation, 2012 test."

[model_settings]
model_name = "ConvSurgeModel"
nlags      = 16

[model_settings.model_pars]
channels   = [32, 16]
filtersize = 3
activation = "swish"

[train_settings]
nepochs         = 5
nbatches        = 64
learning_rate   = 1.0e-3
lr_decay_factor = 0.1
lr_decay_rate   = 400
patience        = 5

[data_settings.model_io]
input  = ["stress_x", "stress_y", "pressure"]
target = ["surge"]

# Training: 2010 — ERA5 file covers 2008-2010, intersect_times trims to surge year
[[data_settings.files]]
path      = "../test_data/surge_schureman_2010.nc"
format    = "netcdf"
split     = "training"
variables = ["surge"]

[[data_settings.files]]
path      = "../test_data/era5_wind_stress_2008_training.jld2"
format    = "jld2"
split     = "training"
variables = ["stress_x", "stress_y", "pressure"]

# Validation: 2011
[[data_settings.files]]
path      = "../test_data/surge_schureman_2011.nc"
format    = "netcdf"
split     = "validation"
variables = ["surge"]

[[data_settings.files]]
path      = "../test_data/era5_wind_stress_2011_testing.jld2"
format    = "jld2"
split     = "validation"
variables = ["stress_x", "stress_y", "pressure"]

# Testing: 2012
[[data_settings.files]]
path      = "../test_data/surge_schureman_2012.nc"
format    = "netcdf"
split     = "testing"
variables = ["surge"]

[[data_settings.files]]
path      = "../test_data/era5_wind_stress_2012_validation.jld2"
format    = "jld2"
split     = "testing"
variables = ["stress_x", "stress_y", "pressure"]
