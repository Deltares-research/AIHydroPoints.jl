# AIHydroPoints run configuration -- full settings reference:
# https://deltares-research.github.io/AIHydroPoints.jl/settings.html
format_version = 2

# DenseSurgeInteractionModel — unstructured deep MLP over forcing + tide
#
# Extends DenseSurgeModel: flattens wind-stress/pressure forcing and tide lag
# windows, concatenates them into one feature vector, and runs several Dense
# layers with a nonlinearity. Unlike BiLinearSurgeInteractionModel's
# multiplicative gate, there is no built-in inductive bias about how tide and
# forcing combine — the "+tide" variant of item 2's deep-MLP test
# (brainstorm_surge_model_status.md).
#
# Usage:
#   pixi run julia --project train.jl examples/DenseSurgeInteractionModel.toml
#
# Increase nepochs to 100+ for a meaningful training run.

[run_info]
runid       = "example"
description = "Deep MLP surge-interaction model on 2011 ERA5 wind stress + Schureman tide/surge."

[model_settings]
model_name = "DenseSurgeInteractionModel"
nlags      = 16

[model_settings.model_pars]
hidden_dims = [64, 32]
activation  = "relu"

[train_settings]
nepochs          = 5
batch_size         = 64
learning_rate    = 1.0e-3
lr_decay_factor  = 0.1
lr_decay_epochs    = 400
early_stopping_epochs         = 5
weight_decay          = 0.0    # L2 weight decay; 0 = off
input_noise_std       = 0.0    # Gaussian input-noise augmentation; 0 = off
validation_split = 0.2

[data_settings.model_io]
input  = ["stress_x", "stress_y", "pressure", "tide"]
target = ["surge"]

# ── Training split ─────────────────────────────────────────────────────────────

[[data_settings.files]]
path      = "../test_data/surge_schureman_2011.nc"
format    = "netcdf"
split     = "training"
variables = ["surge"]

[[data_settings.files]]
path      = "../test_data/era5_wind_stress_2011_testing.jld2"
format    = "jld2"
split     = "training"
variables = ["stress_x", "stress_y", "pressure"]

[[data_settings.files]]
path      = "../test_data/tides_schureman_2011.nc"
format    = "netcdf"
split     = "training"
variables = [{name = "waterlevel", as = "tide"}]

# ── Testing split ──────────────────────────────────────────────────────────────

[[data_settings.files]]
path      = "../test_data/surge_schureman_2012.nc"
format    = "netcdf"
split     = "testing"
variables = ["surge"]

[[data_settings.files]]
path      = "../test_data/era5_wind_stress_2012_validation.jld2"
format    = "jld2"
split     = "testing"
variables = ["stress_x", "stress_y", "pressure"]

[[data_settings.files]]
path      = "../test_data/tides_schureman_2012.nc"
format    = "netcdf"
split     = "testing"
variables = [{name = "waterlevel", as = "tide"}]
