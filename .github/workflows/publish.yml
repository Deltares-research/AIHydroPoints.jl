name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - presentations/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - name: Render docs
        run: pixi run quarto render docs/

      - name: Render presentation
        run: pixi run quarto render presentations/index.qmd --to revealjs

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docs/_site/. _site/
          cp -r presentations _site/presentations

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
